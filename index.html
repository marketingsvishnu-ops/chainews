<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DiamondNews 3D | Cricket News & Match Updates</title>

<meta name="description"
content="DiamondNews 3D - Cricket news, match updates, live scores, tournaments, blogs and cricket stories.">

<style>

/* =========================================================
   DIAMONDNEWS 3D CRICKET WEBSITE
   ========================================================= */

:root{
    --green:#00d084;
    --green2:#008f63;
    --dark:#03130e;
    --dark2:#071e17;
    --dark3:#0b2c22;
    --lime:#d8ff3e;
    --white:#ffffff;
    --text:#e9fff6;
    --muted:#91aaa1;
    --red:#ff3b4d;
    --gold:#ffd45c;
    --glass:rgba(255,255,255,.075);
    --glass2:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.13);
    --shadow:0 25px 70px rgba(0,0,0,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(0,208,132,.13),transparent 25%),
        radial-gradient(circle at 90% 30%,rgba(216,255,62,.08),transparent 22%),
        radial-gradient(circle at 50% 90%,rgba(0,208,132,.08),transparent 30%),
        var(--dark);
    color:var(--text);
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,black,transparent);
    z-index:-1;
}

a{
    color:inherit;
    text-decoration:none;
}

button,input{
    font-family:inherit;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}


/* =========================================================
   3D BACKGROUND ORBS
   ========================================================= */

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    z-index:-1;
    opacity:.35;
}

.orb.one{
    width:250px;
    height:250px;
    background:var(--green);
    top:100px;
    left:-120px;
    box-shadow:0 0 100px var(--green);
    animation:floatOne 8s ease-in-out infinite;
}

.orb.two{
    width:180px;
    height:180px;
    background:var(--lime);
    right:-80px;
    top:45%;
    box-shadow:0 0 100px var(--lime);
    animation:floatTwo 9s ease-in-out infinite;
}

@keyframes floatOne{
    0%,100%{transform:translate3d(0,0,0);}
    50%{transform:translate3d(60px,80px,40px);}
}

@keyframes floatTwo{
    0%,100%{transform:translate3d(0,0,0);}
    50%{transform:translate3d(-70px,-50px,40px);}
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    background:rgba(0,0,0,.35);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(15px);
    font-size:12px;
}

.topbar-inner{
    min-height:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topbar a{
    color:var(--muted);
    margin-left:18px;
}

.topbar a:hover{
    color:var(--green);
}


/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(3,19,14,.72);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(22px);
}

.header-main{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:25px;
    font-weight:1000;
    letter-spacing:-1px;
}

.logo-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:14px;
    color:#06150f;
    background:linear-gradient(145deg,var(--lime),var(--green));
    box-shadow:
        inset 3px 3px 8px rgba(255,255,255,.5),
        inset -5px -5px 10px rgba(0,0,0,.25),
        0 12px 30px rgba(0,208,132,.25);
    transform:perspective(300px) rotateX(8deg) rotateY(-8deg);
}

.logo-icon:after{
    content:"♦";
    font-size:25px;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    font-size:13px;
    font-weight:800;
    color:#b9d0c8;
    position:relative;
}

nav a:after{
    content:"";
    position:absolute;
    left:0;
    bottom:-9px;
    width:0;
    height:2px;
    background:var(--green);
    transition:.3s;
}

nav a:hover{
    color:white;
}

nav a:hover:after{
    width:100%;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.search{
    width:190px;
    padding:11px 15px;
    color:white;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:30px;
    outline:none;
}

.search:focus{
    border-color:var(--green);
    box-shadow:0 0 20px rgba(0,208,132,.12);
}

.menu{
    display:none;
    border:1px solid var(--border);
    background:var(--glass);
    color:white;
    width:43px;
    height:43px;
    border-radius:12px;
    font-size:20px;
}

   BREAKING
   ======
```
